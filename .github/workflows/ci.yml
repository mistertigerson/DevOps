name: CI
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.22.x"           # Specify Go version (example)

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build           # Go build cache
            ~/go/pkg/mod               # Go modules cache
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Build Go application
        run: go build -v -o myapp .

      - name: Build Docker image
        run: docker build -t myapp:latest .

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Setup SSH for Ansible
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa                       # Protect private key:contentReference[oaicite:5]{index=5}
          ssh-keyscan -H 172.31.1.42 >> ~/.ssh/known_hosts

      - name: Run Ansible playbook (deploy systemd service)
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: ansible-playbook -i ./ansible/inventory.ini deploy.yml -u ${{ secrets.REMOTE_USER }} --private-key ~/.ssh/id_rsa:contentReference[oaicite:7]{index=7}

      - name: Save Docker image and copy to remote
        run: |
          docker save -o myapp.tar myapp:latest
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa myapp.tar ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:/tmp/myapp.tar

      - name: Load image and run container on remote
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} \
            "docker load -i /tmp/myapp.tar && docker run -d --name myapp_container -p 8081:80 myapp:latest"

